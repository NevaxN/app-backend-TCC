version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: tcc-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: tccdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        DEV: "true"  # coloca true para dev com hot reload
    container_name: tcc-backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tccdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    volumes:
      - ./src:/app/src # monta o código local só no dev
    command: /bin/sh -c "if [ \"$DEV\" = 'true' ]; then ./gradlew bootRun; else java -jar app.jar; fi"

volumes:
  postgres_data: